services:
  postgres:
    image: postgres:16-alpine
    container_name: skillcheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillcheck
      POSTGRES_USER: ismail
      POSTGRES_PASSWORD: lakroune00@
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillcheck -d skillcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
